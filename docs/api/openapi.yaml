      x-uc: []
      x-roles:
      - PUBLIC
      x-ownership: NONE
      x-source:
      - 'PROPOSED supporting: UC17 §17.2.2.3 PDF p57, UC20 §20.4 PDF pp66-67; Public feature flags and hold settings
        with no secrets.'
