                    - seatId: seat_geo_01
                      row: 1
                      number: 1
                      label: Blue
                      type: REGULAR
                      operationalStatus: ACTIVE
                      state: AVAILABLE
                      price: 100000
                    - seatId: seat_geo_02
                      row: 1
                      number: 3
                      label: Moon
                      type: VIP
                      operationalStatus: ACTIVE
                      state: HELD
                      price: 150000
                    - seatId: seat_geo_03
                      row: 2
                      number: 1
                      label: Leaf
                      type: REGULAR
                      operationalStatus: OUT_OF_SERVICE
                      state: null
                      price: null
                    - seatId: seat_geo_04
                      row: 2
                      number: 3
                      label: Sun
                      type: REGULAR
                      operationalStatus: ACTIVE
                      state: SOLD
                      price: 100000
          headers:
            X-Request-Id:
              schema:
