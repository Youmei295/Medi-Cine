        '200':
          description: The operation succeeds without changing domain state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
              example:
                aiEnabled: true
                pushEnabled: true
                holdTtlSeconds: 600
                maxSeatsPerHold: 1
                admissionPolicyConfigured: true
