    post:
      operationId: confirmAdmission
      tags:
      - UC12
      summary: confirmAdmission
      description: Revalidate every guard at commit. Move UNUSED to USED conditionally and record one admission
        per ticket. The same actor and attemptId with the same payload returns the original admission with 200.
        A different payload or new attempt for a USED ticket returns 409. Use the server clock. Admit only when
        startsAt minus 30 minutes <= server time < startsAt plus 15 minutes. Apply zero extra tolerance and reject
        cancelled showtimes. No Staff override. Atomically records the admission, the USED state, and the audit
        entry. Seat sales and payment capture are outside this operation. Each request requires Idempotency-Key.
        Reuse it for exact retries.
      security:
      - sessionToken: []
      x-status: PROPOSED
      x-uc:
      - UC12
      x-roles:
      - STAFF
      - ADMIN
