  /seat-holds/{holdId}/quotes:
    post:
      operationId: createQuote
      tags:
      - UC03
      summary: createQuote
      description: Requires an active hold owned by the caller. Use promotionCode=null to remove the code. Quotes
        are immutable and do not extend the hold. Use one code per booking. Calculate percentage discounts in integer
        basis points and round the booking-level discount once to the nearest dong, half up, before applying caps.
        Reject zero and totals below the gateway minimum. Revalidate before committing the booking and preserve
        the finalized amount thereafter. Calculates current prices and discounts on the server without creating
        a booking or payment. An invalid code leaves the existing quote intact. The client must discard the discounted
        total and request a quote with promotionCode=null before confirmation. Each request requires Idempotency-Key.
        Reuse it for exact retries.
