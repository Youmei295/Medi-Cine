  /auth/registrations:
    post:
      operationId: registerCustomer
      tags:
      - UC06
      summary: registerCustomer
      description: 'PROPOSED TARGET.  Effects: Creates a CUSTOMER account. Login is a separate operation. Supplying
        a role returns 422. Each request requires Idempotency-Key. Reuse the same key for an exact retry. The operation-specific
        rules for domain duplicates still apply. See API_GUIDE.md.'
      security: []
      x-status: PROPOSED
      x-uc:
      - UC06
      x-roles:
      - PUBLIC
      x-ownership: NONE
      x-source:
      - pa/pa3/Use_Case_Specification_v1.1.pdf §6.2-6.5; PDF pp26-28
      x-preconditions: ''
      x-effects: Creates a CUSTOMER account. Login is a separate operation. Supplying a role returns 422.
      x-idempotency: REQUIRED
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 128
          pattern: ^[A-Za-z0-9_-]+$
        description: PROPOSED retry key, 24h retention; actor + operationId scope.
        example: example_retry_key_0001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
            example:
              displayName: Customer A
              email: customer@example.invalid
              password: ExampleOnly123!
      responses:
        '201':
          description: Creates a CUSTOMER account. Login is a separate operation. Supplying a role returns 422.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: usr_demo_01
                displayName: Customer A
                email: customer@example.invalid
                role: CUSTOMER
                active: true
          headers:
            X-Request-Id:
              schema:
                $ref: '#/components/schemas/Id'
              description: Trace ID without personal data or secrets.
        '409':
          description: ACCOUNT_EXISTS. The response never reports an unverified success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: ACCOUNT_EXISTS
                message: The request was rejected. See code and details.
                details: []
                requestId: req_demo_01
          x-error-codes:
          - ACCOUNT_EXISTS
          - IDEMPOTENCY_IN_PROGRESS
          - IDEMPOTENCY_KEY_REUSED
          headers:
            X-Request-Id:
              schema:
                $ref: '#/components/schemas/Id'
              description: Trace ID without personal data or secrets.
            Retry-After:
              schema:
                type: integer
                minimum: 1
                maximum: 300
              description: Present for 429 and for 409 IDEMPOTENCY_IN_PROGRESS. Clients must avoid automatically
                retrying a business-rule rejection.
              example: 3
        '429':
          description: RATE_LIMITED. The response never reports an unverified success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: RATE_LIMITED
                message: The request was rejected. See code and details.
                details: []
                requestId: req_demo_01
          x-error-codes:
          - RATE_LIMITED
          headers:
            X-Request-Id:
              schema:
                $ref: '#/components/schemas/Id'
              description: Trace ID without personal data or secrets.
            Retry-After:
              schema:
                type: integer
                minimum: 1
                maximum: 300
              description: Present for 429 and for 409 IDEMPOTENCY_IN_PROGRESS. Clients must avoid automatically
                retrying a business-rule rejection.
              example: 3
        '400':
          description: MALFORMED_REQUEST. The response never reports an unverified success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: MALFORMED_REQUEST
                message: The request was rejected. See code and details.
                details: []
                requestId: req_demo_01
          x-error-codes:
          - MALFORMED_REQUEST
          headers:
            X-Request-Id:
              schema:
                $ref: '#/components/schemas/Id'
              description: Trace ID without personal data or secrets.
        '422':
          description: VALIDATION_ERROR / LIMIT_EXCEEDED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
