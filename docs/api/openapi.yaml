  /integrations/payments/vnpay/ipn:
    get:
      operationId: receivePaymentWebhook
      tags:
      - UC04
      summary: Receive VNPAY Sandbox IPN
      description: Provider only. VNPAY Sandbox 2.1.0 signed query callback. Verify the full signed parameter set
        using the provider canonicalization. Validate vnp_TmnCode, vnp_TxnRef, and vnp_Amount against the stored
        attempt. The wire amount equals VND times 100. A successful payment requires both vnp_ResponseCode and vnp_TransactionStatus
        to be 00. Activation awaits project sandbox access evidence. Verify signature, merchant, reference, and
        amount before deduplication. Identify the attempt by vnp_TmnCode and vnp_TxnRef and associate vnp_TransactionNo
        with the evidence. Hash the UTF-8 VNPAY 2.1.0 canonical signed parameter string, excluding signature fields,
        with SHA-256. An already accepted fingerprint for that transaction is an exact replay. A new fingerprint
        is new evidence even if the booking is terminal. If it conflicts with a recorded result or provider transaction
        number, durably store it and queue signed QueryDr before acknowledging with 00. Set verificationStatus=CONFLICT
        and keep reconciliation pending without changing booking, seat, or ticket state. Return 99 if durable acceptance
        fails. A browser return cannot confirm payment. This provider callback is non-cacheable and must not be
        prefetched.
      security: []
      x-status: PROPOSED
      x-uc:
      - UC04
      x-roles:
      - PROVIDER
      x-ownership: NONE
      x-source:
      - pa/pa3/Use_Case_Specification_v1.1.pdf §4.2-4.5; PDF pp20-22
      - https://sandbox.vnpayment.vn/apis/docs/thanh-toan-pay/pay.html
      x-preconditions: Provider only. VNPAY Sandbox 2.1.0 signed query callback. Verify the full signed parameter
        set using the provider canonicalization. Validate vnp_TmnCode, vnp_TxnRef, and vnp_Amount against the stored
        attempt. The wire amount equals VND times 100. A successful payment requires both vnp_ResponseCode and vnp_TransactionStatus
        to be 00. Activation awaits project sandbox access evidence.
      x-effects: Verify signature, merchant, reference, and amount before deduplication. Identify the attempt by
        vnp_TmnCode and vnp_TxnRef and associate vnp_TransactionNo with the evidence. Hash the UTF-8 VNPAY 2.1.0
        canonical signed parameter string, excluding signature fields, with SHA-256. An already accepted fingerprint
        for that transaction is an exact replay. A new fingerprint is new evidence even if the booking is terminal.
        If it conflicts with a recorded result or provider transaction number, durably store it and queue signed
        QueryDr before acknowledging with 00. Set verificationStatus=CONFLICT and keep reconciliation pending without
        changing booking, seat, or ticket state. Return 99 if durable acceptance fails. A browser return cannot
        confirm payment.
      x-idempotency: DOMAIN_OR_READ
      parameters:
      - name: vnp_TmnCode
        in: query
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9]{8}$
      - name: vnp_TxnRef
        in: query
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9]{1,100}$
      - name: vnp_Amount
        in: query
        required: true
        schema:
          type: string
          pattern: ^[0-9]{1,12}$
      - name: vnp_ResponseCode
        in: query
        required: true
        schema:
          type: string
          pattern: ^[0-9]{2}$
      - name: vnp_TransactionStatus
        in: query
        required: true
        schema:
          type: string
          pattern: ^[0-9]{2}$
      - name: vnp_TransactionNo
        in: query
        required: true
        schema:
          type: string
          pattern: ^[0-9]{1,15}$
      - name: vnp_SecureHash
        in: query
        required: true
        schema:
          type: string
          pattern: ^[A-Fa-f0-9]{128}$
      - name: vnp_BankCode
        in: query
        required: false
        schema:
          type: string
      - name: vnp_BankTranNo
        in: query
        required: false
        schema:
          type: string
      - name: vnp_CardType
        in: query
        required: false
        schema:
          type: string
      - name: vnp_OrderInfo
        in: query
        required: false
        schema:
          type: string
      - name: vnp_PayDate
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: 'VNPAY acknowledgment: 00 for newly accepted evidence after durable recording and, for conflicts,
            durable QueryDr scheduling. 02 only for a fingerprint already recorded under the same transaction identity.
            01 unknown reference, 04 amount mismatch, 97 invalid signature, 99 other error or temporary inability
            to durably accept. Acceptance of conflicting evidence does not confirm payment or regress fulfillment.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VnpayIpnAck'
              examples:
                newEvidence:
                  summary: First durable acceptance
                  value:
                    RspCode: '00'
                    Message: Confirm Success
                exactReplay:
                  summary: The accepted transaction fingerprint already exists
                  value:
                    RspCode: '02'
                    Message: Order already confirmed
                conflictingEvidenceAccepted:
                  summary: Conflict durably recorded and QueryDr queued
                  value:
                    RspCode: '00'
                    Message: Confirm Success
                acceptanceUnavailable:
                  summary: Could not durably store the conflict and queue QueryDr
                  value:
                    RspCode: '99'
                    Message: Unknown error
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              example: no-store
      x-integration-status: SANDBOX_ACCESS_OPEN
      x-provider-authentication: Verify VNPAY SecureHash using the documented 2.1.0 canonicalization and configured
        merchant secret. Reject duplicate query keys and compare merchant, transaction reference, and the exact
        scaled amount before state changes.
