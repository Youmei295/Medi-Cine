  /showtimes/{showtimeId}/seats:
    get:
      operationId: getSeatMap
      tags:
      - UC02
      summary: getSeatMap
      description: 'PROPOSED TARGET. The snapshot is authoritative. For OUT_OF_SERVICE seats, state=null. The response
        omits owner and hold IDs. See STATE_AND_EVENTS.md for WSS resynchronization. Effects: Read-only. Domain
        state is unchanged by the read. GET may be retried. For mutations, follow the operation guards and version
        rules in API_GUIDE.md.'
      security: []
      x-status: PROPOSED
      x-uc:
